name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: python3 -m pip install --user pytest==8.3.3
      - run: python3 -m pytest tests -q
      - run: python3 plugins/bias-council/skills/bias-council/scripts/check.py static
      - run: python3 plugins/repo-scan/skills/claude-repo-scan/scripts/scan.py selftest
      # No private-markers.txt in CI (gitignored): this checks IPs/MACs only.
      - run: git ls-files -z | xargs -0 python3 scripts/check_markers.py
